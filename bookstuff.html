<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookshelf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&family=Oswald:wght@500&family=Playfair+Display:ital,wght@0,700;1,700&family=Libre+Baskerville:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, personal, a little proud — a reading wall you show friends.
   IDEA: a real walnut bookshelf mounted on a painted wall; each book read is a spine.
   PICTURE: the shelf itself, rows of spines on planks with bookends, filling the first screen.
   COLOUR and TYPE: deep slate-teal wall (pale sage by day), walnut planks, spines coloured from each book's cover, coral accent; Young Serif, Barlow Condensed, Inter.
   LAYOUT: title row with count and actions, then the shelf full width; search-first add dialog. */
:root{color-scheme:light;
--wall:#fbf6ef;--wall2:#f3e8dc;--ink:#3d3029;--soft:#8c7a6b;
--wood:#cfa97c;--wood2:#ad865c;--woodlite:#ead0ad;--back:#f4ebe0;
--panel:#fffdfa;--line:#ecdfd1;--hover:#f8f0e6;--accent:#c47a5c}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--wall),var(--wall2));color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.band{padding:clamp(20px,3.5vw,48px) max(4vw,16px);max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;justify-content:space-between}
h1{font:400 clamp(32px,5vw,48px)/1.05 "Young Serif",Georgia,serif;margin:0;text-wrap:balance}
h1 button{all:unset;cursor:pointer}h1 button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.sub{color:var(--soft);margin:6px 0 0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px Inter,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.spine:focus-visible,.hit:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;color:var(--soft);font-size:14px}
select,input,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 12px;width:100%}
.tools select{width:auto}
#shelf{margin-top:22px;padding:18px 14px 6px;background:linear-gradient(90deg,var(--wood2),var(--wood)) left/14px 100% no-repeat,linear-gradient(270deg,var(--wood2),var(--wood)) right/14px 100% no-repeat,var(--back);border-radius:6px;box-shadow:inset 0 12px 28px rgba(140,95,50,.14),0 18px 40px rgba(140,95,50,.12)}
.row{position:relative;display:flex;align-items:flex-end;gap:3px;height:214px;padding:0 18px;margin-bottom:22px}
.row::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-16px;height:16px;background:linear-gradient(var(--woodlite),var(--wood) 35%,var(--wood2));border-radius:2px;box-shadow:0 8px 14px rgba(140,95,50,.22)}
.row{gap:1px}
.spine{position:relative;flex:none;border:0;padding:0;cursor:pointer;border-radius:1px 1px 0 0;display:block;background:none;box-shadow:1px 0 2px rgba(90,60,35,.3);transition:transform .2s}
.spine canvas{display:block;width:100%;height:100%;border-radius:inherit}
.spine:hover{transform:translateY(-8px)}
.end{flex:none;width:24px;height:110px;border-radius:12px 12px 2px 2px;background:linear-gradient(90deg,#e2cfbb,#f5e9dc 40%,#d8c1aa)}
.lean{transform-origin:bottom left;transform:rotate(9deg);margin-left:10px}.lean:hover{transform:rotate(9deg) translateY(-6px)}
.empty{height:214px;display:grid;place-items:center;color:var(--soft);text-align:center;font-size:15px;padding:0 20px}
.note{font-size:13px;color:var(--soft);margin-top:14px}
dialog{border:0;border-radius:16px;padding:0;width:min(480px,94vw);max-height:92vh;overflow:auto;background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(90,60,35,.3)}
dialog::backdrop{background:rgba(70,50,35,.35)}
form,.det{padding:22px;display:grid;gap:12px}
dialog h2{font:400 26px/1.1 "Young Serif",serif;margin:0}
label{font-size:14px;font-weight:500;display:grid;gap:4px}
.lbl{font-size:14px;font-weight:500}
.res{display:grid;gap:2px;max-height:300px;overflow:auto}
.res:empty{display:none}
.res p{margin:4px 0;font-size:14px;color:var(--soft)}
.hit{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:0;background:none;color:var(--ink);padding:6px;border-radius:10px;cursor:pointer;font:15px/1.3 Inter,sans-serif;min-height:60px}
.hit:hover{background:var(--hover)}
.hit img,.hit .nocover{width:40px;height:58px;object-fit:cover;border-radius:3px;background:var(--line)}
.hit b{display:block;font-weight:600}.hit span{color:var(--soft);font-size:13px}
.pick{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:14px;align-items:end;padding:12px;border-radius:12px;background:var(--hover)}
.pick img{width:64px;height:96px;object-fit:cover;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.pick strong{display:block;font:400 19px/1.2 "Young Serif",serif}.pick span{color:var(--soft);font-size:14px}
.pick .spine{cursor:default}.pick .spine:hover{transform:none}
details summary{cursor:pointer;font-size:14px;color:var(--soft);min-height:32px;display:flex;align-items:center}
details[open]{display:grid;gap:10px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel) inset}
.stars{display:flex;gap:2px}.stars button{all:unset;cursor:pointer;font-size:26px;width:36px;height:40px;text-align:center;color:var(--line)}.stars button.on{color:#e9a93b}
.stars button:focus-visible{outline:2px solid var(--accent)}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
.foot .del{margin-right:auto;color:var(--accent)}
.meta{color:var(--soft);margin:0}
.vhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.vhead img{width:84px;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#prevImg{width:100%;max-height:46vh;object-fit:contain;border-radius:8px;background:var(--hover);display:block;min-height:120px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;max-width:92vw;text-align:center;display:flex;gap:14px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}
.toast button{all:unset;cursor:pointer;font-weight:600;color:var(--accent);padding:4px 2px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px}
@media(max-width:600px){.row{height:184px;padding:0 8px}.spine{font-size:13px}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.spine{transition:none}}
</style>
</head>
<body>
<main class="band">
  <header>
    <div>
      <h1><button id="name" type="button" aria-label="Shelf name — tap to rename">My Bookshelf</button></h1>
      <p class="sub" id="count"></p>
    </div>
    <div class="acts">
      <button class="btn" id="addBtn" type="button">Add a book</button>
      <button class="btn pri" id="wpBtn" type="button">Make wallpaper</button>
    </div>
  </header>
  <div class="tools">
    <label style="display:flex;gap:8px;align-items:center;font-weight:400">Arrange by
      <select id="sort"><option value="added">Order read</option><option value="colour">Colour (rainbow)</option><option value="author">Author</option><option value="title">Title</option><option value="rating">Rating</option></select>
    </label>
  </div>
  <section id="shelf" aria-label="Bookshelf"></section>
  <p class="note" id="note"></p>
  <div class="tools" style="margin-top:6px">
    <span>Your books are saved in this browser only.</span>
    <button class="btn" id="bkBtn" type="button">Back up books</button>
    <button class="btn" id="rsBtn" type="button">Restore backup</button>
    <button class="btn" id="pgBtn" type="button" hidden>Download shareable page</button>
    <input type="file" id="rsFile" accept=".json,application/json" hidden>
  </div>
  <p class="note">Book search and covers from <a href="https://openlibrary.org" style="color:inherit">Open Library</a>.</p>
</main>

<dialog id="edit"><form id="f" novalidate>
  <h2 id="fTitle">Add a book</h2>
  <label>Find your book<input id="q" type="search" placeholder="Start typing a title or author…" autocomplete="off" enterkeyhint="search"></label>
  <div class="res" id="res" aria-live="polite"></div>
  <div class="pick" id="pick" hidden>
    <div id="pv" aria-hidden="true"></div>
    <img id="pc" alt="" hidden>
    <div><strong id="pT"></strong><span id="pA"></span></div>
  </div>
  <details id="man"><summary>Can’t find it? Type it in or change the spine colour</summary>
    <label>Title<input id="t" maxlength="120" autocomplete="off"></label>
    <label>Author<input id="a" maxlength="80" autocomplete="off"></label>
    <div><span class="lbl">Spine colour</span><div class="sw" id="sw"></div></div>
  </details>
  <div class="grid3">
    <label>Finished<input id="d" type="month"></label>
    <label>Pages<input id="pg" type="number" inputmode="numeric" min="1" max="5000" placeholder="e.g. 320"></label>
  </div>
  <div><span class="lbl">Rating</span><div class="stars" id="stars"></div></div>
  <label>Note<textarea id="n" rows="2" maxlength="400" placeholder="What did you think?"></textarea></label>
  <div class="foot"><button class="btn del" type="button" id="del" hidden>Remove</button><button class="btn" type="button" id="cancel">Cancel</button><button class="btn pri" type="submit">Save</button></div>
</form></dialog>

<dialog id="view"><div class="det">
  <div class="vhead"><div><h2 id="vT"></h2><p class="meta" id="vA"></p></div><img id="vC" alt="" hidden></div>
  <p class="meta" id="vM"></p><p id="vN" style="margin:0"></p>
  <div class="foot"><button class="btn del" type="button" id="vDel">Remove</button><button class="btn" type="button" id="vEdit">Edit</button><button class="btn pri" type="button" id="vClose">Close</button></div>
</div></dialog>

<dialog id="wp"><div class="det">
  <h2>Make wallpaper</h2>
  <label>Size<select id="wpSize">
    <option value="1179x2556">Phone · 1179 × 2556</option><option value="2560x1440">Desktop · 2560 × 1440</option><option value="1920x1080">Desktop · 1920 × 1080</option>
    <option value="3840x2160">4K · 3840 × 2160</option><option value="2048x2732">Tablet · 2048 × 2732</option>
  </select></label>
  <label>Background<select id="wpBg">
    <option value="cream">Cream</option><option value="blush">Blush</option><option value="peach">Peach</option><option value="sage">Sage</option><option value="sky">Sky</option><option value="lavender">Lavender</option>
  </select></label>
  <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="wpLabel" checked style="width:20px;min-height:20px"> Show shelf name and count</label>
  <img id="prevImg" alt="Wallpaper preview">
  <p class="meta" style="font-size:14px" id="wpHint">If nothing downloads, press and hold the picture (phone) or right-click it (computer) and choose “Save image”.</p>
  <div class="foot"><button class="btn" type="button" id="wpClose">Close</button><button class="btn pri" type="button" id="wpSave" disabled>Save wallpaper</button></div>
</div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
const $=id=>document.getElementById(id);
const KEY='bookshelf-wallpaper-maker.v1';
const PAL=['#b23a48','#e07a5f','#f2cc8f','#e9c46a','#81b29a','#2a9d8f','#3d5a80','#264653','#5e548e','#9c6644','#d4a373','#efe6d2','#1f1f24','#c9184a'];
let books=[],shelfName='My Bookshelf',editing=null,formId='',pickColor=null,pickAccent=null,coverColor=null,coverAccent=null,pickCover=null,rating=0;
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const colorOf=b=>b.color||PAL[hash(b.id)%PAL.length];
const lum=hex=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000};
const textOn=hex=>lum(hex)>150?'#1d1d1f':'#f7f2ea';
const rgba=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
const dims=b=>{const h=hash(b.id+'x'),p=+b.pages;return {w:p>0?Math.max(16,Math.min(72,14+2.2*Math.sqrt(p))):24+Math.min(22,(b.title||'').length*.6)+h%11,h:.66+(h%34)/100}};
const coverUrl=(id,s)=>`https://covers.openlibrary.org/b/id/${id}-${s}.jpg`;
const FONTS=[{f:'"Barlow Condensed"',w:600,up:0},{f:'Oswald',w:500,up:1},{f:'"Playfair Display"',w:700,up:0},{f:'"Libre Baskerville"',w:700,up:1},{f:'"Bebas Neue"',w:400,up:1},{f:'Inter',w:600,up:0}];
const FONT_LOADS=['600 20px "Barlow Condensed"','500 20px "Barlow Condensed"','500 20px Oswald','700 20px "Playfair Display"','italic 700 20px "Playfair Display"','700 20px "Libre Baskerville"','400 20px "Bebas Neue"','600 20px Inter','500 20px Inter','400 20px "Young Serif"'];
function noise(){if(noise.c)return noise.c;const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),im=x.createImageData(96,96);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=26}x.putImageData(im,0,0);return noise.c=c}
function fit(x,txt,F,ital,size,min,maxLen){let s=size;const set=()=>{x.font=(ital?'italic ':'')+F.w+' '+s+'px '+F.f};set();while(s>min&&x.measureText(txt).width>maxLen){s-=.5;set()}let t=txt;while(t.length>1&&x.measureText(t).width>maxLen)t=t.slice(0,-2).trimEnd()+'…';return {t,s,tw:x.measureText(t).width}}
function vtext(x,t,cx,y0,len,align){x.save();x.translate(cx,y0);x.rotate(Math.PI/2);x.textBaseline='middle';const tw=x.measureText(t).width;x.fillText(t,align==='center'?(len-tw)/2:align==='end'?len-tw:0,0);x.restore()}
function drawSpine(x,b,w,h,k){
  const c=colorOf(b),bible=b.author==='The Bible',ac=b.accent||null,hv=hash(b.id+'v');
  const v0=bible?0:hv%5,v=w<26*k&&(v0===1||v0===3)?0:v0,F=bible?FONTS[3]:v===4?{f:'"Playfair Display"',w:700,up:0}:FONTS[hash(b.id+'f')%FONTS.length];
  const band=ac||rgba(textOn(c),.35);let tc=bible&&ac?ac:textOn(c);
  x.fillStyle=c;x.fillRect(0,0,w,h);
  let top=18*k,bot=h-18*k,auPos='end',emblem=false,ital=v===4,ttc=tc;
  if(v===0){x.fillStyle=band;x.fillRect(0,11*k,w,2.5*k);x.fillRect(0,h-13.5*k,w,2.5*k);top=22*k;bot=h-22*k}
  else if(v===1){const L=lum(c)>140?'#2b2623':'#f2ecdf',ly=Math.round(h*.11),ttl=F.up?(b.title||'Untitled').toUpperCase():(b.title||'Untitled');
    const tt=fit(x,ttl,F,false,Math.min(13*k,(w-14*k)*.62),7*k,h*.74-14*k),lh=Math.max(h*.36,Math.min(h*.74,tt.tw+16*k));
    x.fillStyle=L;x.fillRect(3*k,ly,w-6*k,lh);x.strokeStyle=rgba(textOn(L),.35);x.lineWidth=.8*k;x.strokeRect(5.5*k,ly+2.5*k,w-11*k,lh-5*k);
    x.font=F.w+' '+tt.s+'px '+F.f;x.fillStyle=textOn(L);vtext(x,tt.t,w/2,ly+7*k,lh-14*k,'center');
    top=ly+lh+8*k;bot=h-14*k;
    if(b.author&&bot-top>20*k){const au=b.author.split(' ').pop(),a=fit(x,F.up?au.toUpperCase():au,F,false,Math.min(10*k,(w-8*k)*.5),7*k,bot-top);if(!a.t.endsWith('…')){x.fillStyle=tc;x.globalAlpha=.85;vtext(x,a.t,w/2,top,bot-top,'center');x.globalAlpha=1}}
    finish(x,w,h,k);return}
  else if(v===2){const bh=Math.round(h*.12);x.fillStyle=band;x.fillRect(0,0,w,bh);x.fillRect(0,bh+3*k,w,1.2*k);top=bh+12*k;bot=h-24*k;emblem=true}
  else if(v===3){auPos='start';top=14*k;bot=h-24*k;emblem=true}
  else{x.fillStyle=band;for(const y of [9,13])x.fillRect(0,y*k,w,1.2*k);for(const y of [10.2,14.2])x.fillRect(0,h-y*k,w,1.2*k);top=22*k;bot=h-22*k}
  if(emblem){x.fillStyle=rgba(tc.startsWith('#')?tc:'#ffffff',.75);const ey=h-12*k;if(hv%2){x.beginPath();x.arc(w/2,ey,3.2*k,0,7);x.fill()}else x.fillRect(w/2-3*k,ey-3*k,6*k,6*k)}
  let title=b.title||'Untitled';if(F.up)title=title.toUpperCase();
  const len=bot-top,big=F.f.includes('Bebas')?1.2:1;
  let au=b.author?b.author.split(' ').pop():'';if(F.up)au=au.toUpperCase();
  let aFit=null,gap=8*k;
  if(au&&w>=22*k){aFit=fit(x,au,F,ital,Math.min(10*k,(w-8*k)*.5)*big,7*k,len*.34);if(aFit.t!==au)aFit=null}
  const ts=Math.max(7*k,Math.min(15*k*big,(w-8*k)*.62)),tmin=Math.min(9*k,ts);
  let tFit=fit(x,title,F,ital,ts,tmin,len-(aFit?aFit.tw+gap:0));
  if(aFit&&tFit.t!==title){aFit=null;tFit=fit(x,title,F,ital,ts,tmin,len)}
  x.fillStyle=ttc;
  if(aFit){
    const af=(ital?'italic ':'')+F.w+' '+aFit.s+'px '+F.f;
    if(auPos==='start'){x.font=af;x.globalAlpha=.85;vtext(x,aFit.t,w/2,top,aFit.tw,'start');x.globalAlpha=1;x.font=(ital?'italic ':'')+F.w+' '+tFit.s+'px '+F.f;vtext(x,tFit.t,w/2,top+aFit.tw+gap,len-aFit.tw-gap,'center')}
    else{x.font=(ital?'italic ':'')+F.w+' '+tFit.s+'px '+F.f;vtext(x,tFit.t,w/2,top,len-aFit.tw-gap,'center');x.font=af;x.globalAlpha=.85;vtext(x,aFit.t,w/2,bot-aFit.tw,aFit.tw,'start');x.globalAlpha=1}
  }else vtext(x,tFit.t,w/2,top,len,'center');
  finish(x,w,h,k);
}
function finish(x,w,h,k){
  x.globalAlpha=1;x.fillStyle=x.createPattern(noise(),'repeat');x.fillRect(0,0,w,h);
  const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgba(0,0,0,.40)');g.addColorStop(.1,'rgba(255,255,255,.08)');g.addColorStop(.28,'rgba(255,255,255,.17)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(.86,'rgba(0,0,0,.14)');g.addColorStop(1,'rgba(0,0,0,.45)');
  x.fillStyle=g;x.fillRect(0,0,w,h);x.fillStyle='rgba(255,255,255,.14)';x.fillRect(0,0,w,Math.max(1,k));
  const bg=x.createLinearGradient(0,h-8*k,0,h);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,.22)');x.fillStyle=bg;x.fillRect(0,h-8*k,w,8*k);
}
function spineEl(b,scale,rh){
  const d=dims(b),W=Math.round(d.w*scale),H=Math.round(d.h*(rh-14));
  const el=document.createElement('button');el.type='button';el.className='spine';el.style.width=W+'px';el.style.height=H+'px';
  const cv=document.createElement('canvas'),r=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(W*r);cv.height=Math.round(H*r);
  const x=cv.getContext('2d');x.scale(r,r);drawSpine(x,b,W,H,scale);el.append(cv);
  el.setAttribute('aria-label',(b.title||'Untitled')+(b.author?' by '+b.author:''));
  return el;
}
function chunk(list,width,scale){
  const rows=[[]];let used=0;
  for(const b of list){const w=dims(b).w*scale+1;if(used+w>width-30*scale&&rows.at(-1).length){rows.push([]);used=0}rows.at(-1).push(b);used+=w}

}

$('wpSave').onclick=()=>{
  if(!wpBlob)return;
  const file=new File([wpBlob],wpName,{type:'image/png'});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare?.({files:[file]})){
    navigator.share({files:[file]}).then(()=>toast('Choose “Save Image”, then set it as your wallpaper')).catch(e=>{if(e.name!=='AbortError'){download(wpBlob,wpName);toast('Check your Downloads')}});
  }else{download(wpBlob,wpName);toast('Saved — check your Downloads folder')}
};

/* ---- standalone page to send ---- */
function standaloneMain(){
  const $=id=>document.getElementById(id);
  function show(b){
    $('vT').textContent=b.title||'Untitled';$('vA').textContent=b.author?'by '+b.author:'';
    const when=b.finished?new Date(b.finished+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'}):'';
    $('vM').textContent=[when&&'Finished '+when,b.rating?'★'.repeat(b.rating)+'☆'.repeat(5-b.rating):''].filter(Boolean).join(' · ');
    $('vN').textContent=b.note||'';
    const im=$('vC');if(b.cover){im.src='https://covers.openlibrary.org/b/id/'+b.cover+'-M.jpg';im.hidden=false;im.onerror=()=>{im.hidden=true}}else im.hidden=true;
    $('view').showModal();
  }
  function render(){
    const sh=$('shelf');sh.replaceChildren();
    const small=innerWidth<600,scale=small?.86:1,rh=small?184:214;
    const rows=chunk(B,sh.clientWidth-(small?16:36),scale);
    rows.forEach((r,ri)=>{
      const row=document.createElement('div');row.className='row';
      r.forEach((b,i)=>{const el=spineEl(b,scale,rh);if(ri===rows.length-1&&i===r.length-1&&r.length>2)el.classList.add('lean');el.onclick=()=>show(b);row.append(el)});
      if(ri===rows.length-1){const e=document.createElement('div');e.className='end';e.style.marginLeft='auto';row.append(e)}
      sh.append(row);
    });
  }
  $('vClose').onclick=()=>$('view').close();
  let t;addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(render,80)});render();
  Promise.all(FONT_LOADS.map(f=>document.fonts.load(f).catch(()=>{}))).then(render);
}
const escH=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
function buildPage(){
  const data=JSON.stringify(sorted().map(({id,title,author,finished,rating,color,accent,cover,note})=>({id,title,author,finished,rating,color,accent,cover,note}))).replace(/</g,'\\u003c');
  const css=document.querySelector('style').textContent;
  const fonts=document.querySelector('link[rel=stylesheet]').outerHTML;
  const n=books.length,when=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
  const S='script';
  return ['<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">',
    '<title>'+escH(shelfName)+'</title>',fonts,'<style>'+css+'</style></head><body>',
    '<main class="band"><header><div><h1>'+escH(shelfName)+'</h1><p class="sub">'+n+' book'+(n===1?'':'s')+' read · tap a spine for details</p></div></header>',
    '<section id="shelf" aria-label="Bookshelf"></section><p class="note">Snapshot from '+escH(when)+'</p></main>',
    '<dialog id="view"><div class="det"><div class="vhead"><div><h2 id="vT"></h2><p class="meta" id="vA"></p></div><img id="vC" alt="" hidden></div><p class="meta" id="vM"></p><p id="vN" style="margin:0"></p>',
    '<div class="foot"><button class="btn pri" type="button" id="vClose">Close</button></div></div></dialog>',
    '<'+S+'>{const B='+data+';const PAL='+JSON.stringify(PAL)+';',
    'const hash='+hash+';const colorOf='+colorOf+';const lum='+lum+';const textOn='+textOn+';const rgba='+rgba+';const dims='+dims+';const FONTS='+JSON.stringify(FONTS)+';const FONT_LOADS='+JSON.stringify(FONT_LOADS)+';',
    [noise,fit,vtext,drawSpine,finish,spineEl,chunk].map(f=>f.toString()).join('\n')+'('+standaloneMain+')()}</'+S+'>',
    '</body></html>'].join('\n');
}
$('pgBtn').onclick=()=>{download(buildPage(),`${fileBase()}.html`,'text/html');toast('Saved — send the file to anyone')};

/* ---- backup ---- */
$('bkBtn').onclick=()=>{download(JSON.stringify({name:shelfName,books},null,1),`${fileBase()} backup.json`,'application/json');toast('Backup saved to your downloads')};
$('rsBtn').onclick=()=>$('rsFile').click();
const hexOk=v=>/^#[0-9a-f]{6}$/i.test(v)?v:null;
$('rsFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.books))throw 0;
  books=j.books.filter(b=>b&&typeof b.title==='string').map(b=>({id:String(b.id||Math.random().toString(36).slice(2)).slice(0,40),title:b.title.slice(0,120),author:String(b.author||'').slice(0,80),finished:/^\d{4}-\d{2}$/.test(b.finished)?b.finished:'',rating:Math.max(0,Math.min(5,b.rating|0)),color:hexOk(b.color),accent:hexOk(b.accent),cover:Number.isInteger(b.cover)?b.cover:null,pages:Number.isInteger(b.pages)&&b.pages>0&&b.pages<=5000?b.pages:null,note:String(b.note||'').slice(0,400),addedAt:+b.addedAt||0}));
  if(typeof j.name==='string'&&j.name.trim())shelfName=j.name.trim().slice(0,60);toast(`Restored ${books.length} books`);after()}catch{toast('That file isn’t a bookshelf backup')}e.target.value=''};

new ResizeObserver(()=>{clearTimeout(render.t);render.t=setTimeout(render,80)}).observe($('shelf'));
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){books=Array.isArray(j.books)?j.books:[];if(j.name)shelfName=j.name;if(j.bg){wpBg=j.bg;$('wpBg').value=j.bg}}}catch{}
after();
backfill();
Promise.all(FONT_LOADS.map(f=>document.fonts.load(f).catch(()=>{}))).then(render);
}
</script>
</body>
</html>
